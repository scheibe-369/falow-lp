<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falow · Conversas que viram vendas</title>
    <meta
      name="description"
      content="Automação de DMs e comentários do Instagram: regras de palavra-chave, sequências visuais e dashboard. O Falow responde em segundos e transforma conversas em vendas. Teste 14 dias grátis."
    />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0d0c" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Falow · Conversas que viram vendas" />
    <meta
      property="og:description"
      content="Automação de DMs e comentários do Instagram: regras de palavra-chave, sequências visuais e dashboard. O Falow responde em segundos. Teste 14 dias grátis."
    />
    <meta property="og:image" content="/og-cover.webp" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Falow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Automação conversacional para Instagram: regras de palavra-chave, sequências visuais e dashboard de conversas.",
        "inLanguage": "pt-BR"
      }
    </script>
    <script>
      // Gate anti-FOUC: só marca reveal-on se o JS roda. CSS esconde estados
      // iniciais apenas sob esta classe + prefers-reduced-motion: no-preference.
      document.documentElement.classList.add('reveal-on');
      // Preloader só na primeira visita da sessão e com motion permitido.
      (function () {
        var seen = false;
        try {
          seen = sessionStorage.getItem('falow-preloaded') === '1';
        } catch (e) {}
        var motionOk = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
        if (!seen && motionOk) document.documentElement.dataset.preloader = 'on';
      })();
    </script>
    <style>
      /* CSS crítico do preloader: pinta antes do bundle chegar.
         A geometria do #pl-lockup é a da assinatura oficial e está espelhada
         em src/shared/ui/brandMark.js (ASSINATURA). Mexeu num, mexe no outro. */
      html[data-preloader='on'] body {
        overflow: hidden;
      }
      html[data-preloader='on'] #preloader {
        display: grid;
      }
      #preloader {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 90;
        place-items: center;
        overflow: hidden;
        background: #0b0d0c;
        -webkit-mask-image: url(#pl-iris-mask);
        mask-image: url(#pl-iris-mask);
      }
      /* Nasce com só o símbolo, centrado e grande: a palavra entra depois e a
         assinatura recua pro lugar dela. O deslocamento e a origem são os da
         ASSINATURA, então o primeiro quadro já está no lugar certo sem JS.
         Quem carrega o transform é a div, não o <svg>: xPercent do GSAP mede
         offsetWidth, que SVG raiz não tem. */
      #pl-lockup {
        width: min(600px, 76vw);
        color: #f7f8f3;
        transform-origin: 11.824% 50%;
        transform: translateX(38.176%) scale(1.75);
      }
      #pl-logo {
        display: block;
        width: 100%;
        height: auto;
      }
      /* 1574 = comprimento do arco (raio 292.79 x abertura de 307.98°) */
      #pl-arc {
        stroke-dasharray: 1574;
        stroke-dashoffset: 1574;
      }
      /* Escondido por opacidade, não por scale(0): ao rebasear a origem pro
         centro do ponto, o GSAP tenta preservar o transform que já estava no
         CSS, e um scale(0) é degenerado (não tem inversa). O resultado é um
         deslocamento lixo. Quem zera a escala é o GSAP, já com a origem certa. */
      #pl-dot {
        opacity: 0;
      }
      #preloader .pl-tagline {
        position: absolute;
        bottom: 2rem;
        left: 0;
        right: 0;
        opacity: 0;
        text-align: center;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.85rem;
        color: rgba(247, 248, 243, 0.55);
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div id="preloader" aria-hidden="true">
      <!-- Só o símbolo vem no HTML, pra pintar no primeiro quadro. O wordmark
           (path grande) é injetado pelo preloader.js dentro deste mesmo <svg>,
           já na posição oficial: a viewBox é o bbox da assinatura inteira. -->
      <div id="pl-lockup">
        <svg id="pl-logo" viewBox="629.94 475.74 2912.06 688.66" fill="none" aria-hidden="true">
          <path
            id="pl-arc"
            d="M 866.53 547.82 A 292.79 292.79 0 1 1 693.38 737.45"
            stroke="#32E875"
            stroke-width="103.07"
            stroke-linecap="round"
          />
          <circle id="pl-dot" cx="723.79" cy="582.65" r="77.3" fill="#FFD43B" />
        </svg>
      </div>
      <p class="pl-tagline">Conversas que viram vendas.</p>
    </div>

    <!-- Máscara geométrica da íris de saída do preloader: um raio de círculo
         animado (via atributo SVG, direto pelo GSAP) é muito mais barato pro
         navegador que recalcular um radial-gradient em CSS a cada frame. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <mask id="pl-iris-mask" maskUnits="userSpaceOnUse" x="-10000" y="-10000" width="20000" height="20000">
          <rect x="-10000" y="-10000" width="20000" height="20000" fill="#fff" />
          <circle id="pl-iris" cx="0" cy="0" r="0" fill="#000" />
        </mask>
      </defs>
    </svg>

    <div id="app">
      <main id="main"></main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
